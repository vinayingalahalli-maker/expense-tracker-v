$kind: http-request
name: Login as Approver
order: 2000
method: POST
url: "{{base_url}}/auth/login"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "bob@northbeam.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.token) {
          pm.environment.set("auth_token", json.token);
          pm.environment.set("current_user_id", json.user.id);
          console.log("Token saved for Approver:", json.user.email);
      }
    language: text/javascript
examples: ./.resources/Login as Approver.resources/examples
