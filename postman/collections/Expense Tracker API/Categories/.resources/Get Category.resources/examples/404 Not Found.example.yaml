$kind: http-example
name: 404 Not Found
request:
  url: "{{base_url}}/categories/cat-999"
  method: GET
  pathVariables:
    - key: categoryId
      value: "{{category_id}}"
      description: The unique ID of the category
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "not_found",
        "message": "Category cat-999 does not exist."
      }
order: 2000
