$kind: http-example
name: 422 Receipt Required
request:
  url: "{{base_url}}/expenses"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "category_id": "cat-001",
        "amount": 120.50,
        "currency": "USD",
        "date": "2024-06-10",
        "merchant": "Delta Airlines",
        "description": "Flight to NYC for client meeting"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "validation_error",
        "message": "Request body contains invalid fields.",
        "details": [
          {
            "field": "receipt_url",
            "issue": "A receipt is required for Travel expenses above $50.00."
          }
        ]
      }
order: 3000
