$kind: http-request
description: 'Generated from cURL: curl -X POST "{{base_url}}/claims/:claimId/submit" -H "Authorization: Bearer {{employee_token}}"'
url: "{{base_url}}/claims/:claimId/submit"
method: POST
headers:
  Authorization: Bearer {{employee_token}}
pathVariables:
  claimId: "{{it_claim_id}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Claim submitted successfully", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Claim status is submitted", function () {
          const json = pm.response.json();
          pm.expect(json.status).to.equal("submitted");
      });
    language: text/javascript
settings: {}
order: 4000
