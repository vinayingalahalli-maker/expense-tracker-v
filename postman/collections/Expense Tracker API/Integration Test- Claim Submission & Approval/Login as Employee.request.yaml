$kind: http-request
description: "Generated from cURL: curl -X POST \"{{base_url}}/auth/login\" -H \"Content-Type: application/json\" -d '{\"email\":\"alice@northbeam.com\",\"password\":\"password123\"}'"
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"email":"alice@northbeam.com","password":"password123"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Employee login succeeds", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response contains token", function () {
          const json = pm.response.json();
          pm.expect(json.token).to.be.a("string").and.not.empty;
          pm.environment.set("employee_token", json.token);
          pm.environment.set("employee_id", json.user.id);
      });
    language: text/javascript
settings: {}
order: 1000
